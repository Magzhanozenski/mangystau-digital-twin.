generators:
- id: MAEK
  bus: 34
  name: МАЭК (ТЭЦ-1, ТЭЦ-2, ТЭС) — эквивалент на шинах 220 кВ ТЭЦ-3
  slack: true
  p_mw: null
  p_max_mw: 960
  q_min_mvar: -400
  q_max_mvar: 500
  v_pu: 1.02
  ramp_mw_h: 120
  status: допущение
  basis: все станции МАЭК сведены в один источник на шинах 220 кВ ТЭЦ-3
  marks:
    p_max_mw:
      status: источник
      source: https://ru.wikipedia.org/wiki/Мангистауский_атомно-энергетический_комбинат
      basis: располагаемая мощность ТЭЦ-1 45 + ТЭЦ-2 465 + ТЭС 450 МВт (Википедия, баланс 2014 г. — вторичный)
    location:
      status: допущение
      basis: точка подключения всех станций — шины 220 кВ ТЭЦ-3
    v_pu:
      status: допущение
      basis: напряжение шин 220 кВ МАЭК 1.02 о.е.
    q_limits:
      status: допущение
      basis: −400…+500 Мвар
    slack:
      status: допущение
      basis: МАЭК — основной источник энергоузла, балансирующий
- id: ATYRAU
  bus: 39
  name: Атырауский энергоузел — эквивалент по ВЛ 220 кВ
  slack: false
  p_mw: 0.0
  p_max_mw: 80
  q_min_mvar: -100
  q_max_mvar: 100
  v_pu: 1.0
  ramp_mw_h: 80
  status: допущение
  basis: 'решение пользователя: эквивалент с P = 0, держит напряжение; переток — отдельным сценарием'
  marks:
    p_max_mw:
      status: допущение
      basis: переток по слабой связи ~80 МВт (dknews.kz, 14.11.2025, дата измерения не указана)
    location:
      status: допущение
      basis: конец ВЛ 220 кВ у края снимка OSM
    v_pu:
      status: допущение
      basis: 1,0 о.е.
    q_limits:
      status: допущение
      basis: ±100 Мвар
    slack:
      status: допущение
      basis: PV-узел, P = 0
model:
  alpha_al_per_c:
    value: 0.00403
    status: допущение
    basis: температурный коэффициент сопротивления алюминия (стандартное физическое значение; в модели применяется ко всему проводу АС)
  conductor_overheat_c:
    value: 15
    status: допущение
    basis: провод под нагрузкой условно на 15 °C теплее воздуха (для поправки сопротивления)
  reactive_load:
    tan_phi_base: 0.42
    tan_phi_per_c_above_25: 0.005
    status: допущение
    basis: cos φ ≈ 0.92 при умеренной температуре; в жару растёт реактивная нагрузка кондиционеров
  static_rating:
    conductor_t_max_c: 70
    reference_air_c: 25
    max_factor: 1.25
    status: допущение
    basis: допустимый ток ∝ sqrt((70 − T)/(70 − 25)), ограничен сверху 1.25
  voltage_limits_pu:
    crit_low: 0.9
    warn_low: 0.95
    warn_high: 1.05
    crit_high: 1.1
    status: допущение
    basis: пороги для прототипа; реальные допустимые уровни определяются нормативами для конкретной сети
  achr_reserve:
