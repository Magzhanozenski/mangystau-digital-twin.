    value: {y2019: 496, y2022: 553, y2023: 546, y2024: 608}
    unit: МВт
    source: *mrek_2024
    accessed: 2026-11-12
    location: "2024 — стр. PDF 4; 2023 — mrek_2023 стр. PDF 3; 2022 — mrek_2022 стр. PDF 5; 2019 — mrek_2019 стр. PDF 3"
    quote: "608 МВт — максимальная нагрузка в электрических сетях"
    confidence: прямо указано
    note: "2022: в тексте «55МВт3», 553 — по склейке цифр (выведено). 2021: в отчёте «542 МВА» под той же подписью (mrek_2021 стр. PDF 3) — единица, видимо, опечатка. Дата и час максимума не указаны."

  - object: {type: сеть, name: "АО «МРЭК» (вся компания)"}
    field: объём передачи электроэнергии
    value: {y2019: 3231, y2020: 3623, y2021: 3652, y2022: 3498, y2023: 3435, y2024: 3773}
    unit: млн кВт·ч
    source: *mrek_2024
    accessed: 2026-11-12
    location: "2022–2024 — стр. PDF 3 («3,773 млрд кВт∙ч»); 2019–2021 — mrek_2021 стр. PDF 3"
    quote: "2024 — 3,773 млрд кВт∙ч"
    confidence: прямо указано
    note: "В отчётах 2019–2022 подпись «тыс. кВт·ч» — ошибка единицы, верно млн кВт·ч (подтверждено отчётом 2024 и mrek_info_2023)."

  - object: {type: сеть, name: "АО «МРЭК» (вся компания)"}
    field: средняя нагрузка (энергия / 8760 ч) и коэффициент заполнения графика
    value: {avg_2023_mw: 392, avg_2024_mw: 430, load_factor_2023: 0.72, load_factor_2024: 0.71}
    unit: "МВт; о.е."
    source: *mrek_2024
    accessed: 2026-11-12
    location: "расчёт по двум фактам выше"
    quote: "3 435 млн кВт·ч / 8760 ч ≈ 392 МВт; 392 / 546 ≈ 0,72"
    confidence: выведено
    note: "Передача включает потери (3,6–3,3 %). 2024 — високосный (8784 ч): 3773/8784 ≈ 430 МВт, 430/608 ≈ 0,71. Коэффициент — для всей сети МРЭК, не для отдельного острова."

