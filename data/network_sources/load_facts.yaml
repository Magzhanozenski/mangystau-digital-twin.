# Факты о нагрузке и потреблении электроэнергии в Мангистауской области (шаг 2.3, пункт 1).
#
# Назначение: опора для оценок нагрузки по островам network_real.yaml (load_estimates.yaml).
# Правила — как в documents.yaml:
# - только найденные факты с URL и местом в документе; чего нет — в not_found;
# - confidence: «прямо указано» / «выведено» (обоснование в note);
# - quote — короткий пересказ/цитата (до 15 слов); location — для PDF «стр. PDF N»;
# - новости — вторичный источник; дата измерения часто не указана — это отмечено.
# Почасовых рядов нагрузки в открытом доступе не найдено (см. not_found).

