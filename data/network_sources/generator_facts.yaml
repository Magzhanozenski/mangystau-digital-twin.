# Факты о генерирующем оборудовании для шага 3.1 (ограничения генераторов: минимальная загрузка, пуск,
# скорость набора). Правила — как в documents.yaml: URL, место, короткая цитата, «прямо указано» / «выведено».
# Паспортных данных агрегатов МАЭК в открытом доступе не найдено: для паровых блоков используются типовые
# характеристики по технологии (учебные и справочные источники) — их применение к МАЭК — ДОПУЩЕНИЕ.

