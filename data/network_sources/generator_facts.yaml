  # ---------------------------------------------------------------- паровые блоки: типовые характеристики
  - object: {type: тип, name: "Энергоблоки ТЭС (общие сведения)"}
    field: длительность пуска по тепловому состоянию
    value: {hot_start_h: [1, 2], cold_start_h: [6, 8], hot_if_down_lt_h: [6, 10], cold_if_down_gt_h: [70, 90]}
    unit: ч
    source: *tpu_regimes
    accessed: 2026-11-15
    location: "лекция «Режимы работы оборудования ТЭС и ГЭС», стр. PDF 16–17"
    quote: "пуск из горячего состояния 1…2 часа, а из холодного 6…8 часов"
    confidence: прямо указано
    note: "Горячий пуск — при простое менее 6…10 ч, холодный — более 70…90 ч (по ПТЭ). Учебный источник, без привязки к типу блока."

  - object: {type: тип, name: "Энергоблоки ТЭС (общие сведения)"}
    field: скорость нагружения и технический минимум
    value: {required_ramp_up_to_pct_per_min: 5, tech_min: "определяется котлом"}
    unit: "%/мин"
    source: *tpu_regimes
    accessed: 2026-11-15
    location: "стр. PDF 7 (технический минимум), стр. PDF 10 (скорость нагружения)"
    quote: "скорости нагружения блоков … до 5% номинальной мощности в минуту"
    confidence: прямо указано
    note: "5 %/мин — требование энергосистемы, а не возможность любого блока; численного технического минимума для газовых котлов в лекции нет."

  - object: {type: тип, name: "Энергоблок 200 МВт с котлом ТП-100 (пылеугольный)"}
    field: минимальная нагрузка и скорость нагружения
    value: {min_load_mw: 50, min_load_pct: 25, ramp_mw_per_min: [0.5, 1.3], from_50_to_200_h: 1.5}
    unit: "МВт; МВт/мин; ч"
    source: *leg_200mw
    accessed: 2026-11-15
    location: "«Минимальные нагрузки энергоблоков с котлами ТП-100»"
    quote: "минимальной нагрузкой … следует считать 50 МВт"
    confidence: прямо указано
    note: "Пылеугольный блок, не газовый и не ТЭЦ; используется только как ориентир порядка величин (≈0,25–0,65 %/мин)."

