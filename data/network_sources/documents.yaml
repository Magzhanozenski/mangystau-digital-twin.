# Факты о сети 110 и 220 кВ Мангистауской области из открытых документов (шаг 2.2, пункт 3).
#
# Назначение: источник названий, параметров и мощностей для сборки data/network_real.yaml
# (OSM даёт трассы и длины, но не названия, провода и мощности трансформаторов).
#
# Правила:
# - здесь только факты, найденные в документах, с URL и местом в документе;
#   ничего не додумано. Чего найти не удалось — в списке not_found в конце файла;
# - confidence: "прямо указано" — число/название стоит в тексте как есть;
#   "выведено" — текст искажён при извлечении или связь с объектом сделана по смыслу
#   (обоснование в поле note);
# - quote — короткий пересказ/цитата (до 15 слов);
# - location: для PDF — "стр. PDF N" (номер страницы файла, не печатный номер);
# - accessed — дата обращения; PDF читались через web-fetch, текст извлечён pdftotext локально;
# - новости и Википедия — вторичные источники, это отмечено в note.
#
# Короткие имена источников (sources) используются в поле source через полный URL ниже.

