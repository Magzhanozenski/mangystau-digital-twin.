# Оценки нагрузки для островов network_real.yaml (шаг 2.3, пункт 2). Читается twin/build_real.py.
#
# Метод: средняя нагрузка потребителя = годовое потребление (load_facts.yaml) / 8760 ч.
# Нагрузка раскладывается по ПС OSM (allocation) — это всегда ДОПУЩЕНИЕ: где именно подключён потребитель,
# в документах не сказано; основание — положение ПС относительно месторождения/посёлка.
# Опорные режимы (scenarios) получаются умножением средней нагрузки на коэффициент — тоже ДОПУЩЕНИЕ.
# Реальных почасовых данных нет (load_facts.yaml → not_found).
#
# Поля: energy_mln_kwh — годовое потребление; avg_mw — если энергии нет, задаётся средняя мощность
# напрямую (только как допущение, с диапазоном range_mw). status/source/basis — как во всём проекте.

year: 2023
hours: 8760

load_facts: "data/network_sources/load_facts.yaml"

scenarios:
  # множитель к средней нагрузке
  min:
    factor: 0.8
    status: допущение
    basis: "ночной/выходной минимум ≈ 80 % средней; для нефтедобычи (насосы, работа круглосуточно) график плоский"
  base:
    factor: 1.0
    status: допущение
    basis: "средняя нагрузка года = энергия / 8760 ч"
  peak:
    factor: 1.3925
    status: допущение
    basis: "пик = средняя / 0,718 — коэффициент заполнения сети МРЭК 2023 (392,1 / 546 МВт, выведено в load_facts.yaml), год тот же, что у потребления; было 1/0,71 (2023–2024) — пик 2023 превышался на 1 % (шаг 2.4); для промысловой нагрузки график, вероятно, плотнее — оценка пика сверху"

