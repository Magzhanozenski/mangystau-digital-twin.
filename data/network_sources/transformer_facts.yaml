# Факты о трансформаторах и автотрансформаторах для сети Мангистау (шаг 2.4, пункт 1).
#
# Правила — как в documents.yaml: только найденные факты с URL и местом; confidence «прямо указано» / «выведено»;
# quote — до 15 слов. Паспортные параметры конкретных аппаратов не найдены — для модели берутся типовые
# значения по стандартам (это источник для ТИПА, но применение к конкретной ПС — допущение).
# Мощности трансформаторов ПС вне модели (Южная 2×25, КС-Узень 2×16, Теньга 2×6,3, ГПП-2Г 2×25, Плато 1×40 МВА)
# уже записаны в documents.yaml и здесь не повторяются.

