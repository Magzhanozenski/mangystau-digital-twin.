# Модель сети 110 кВ Мангистауской области — УСЛОВНАЯ.
#
# Каждая запись помечена полем status:
#   источник  — значение взято из документа, ссылка в поле source;
#   допущение — значение выбрано для прототипа, в поле basis — на чём основано.
# Сейчас ВСЕ значения — допущения. Названия подстанций реальные, но топология,
# длины, марки проводов, нагрузки и мощности станций придуманы.
# Эти данные совпадают с core_js/engine2.js (проверяется тестом tests/test_network_data.py).

meta:
  base_mva: 100
  base_kv: 110
  frequency_hz: 50

conductors:
  # Погонные параметры при +20 °C; I_rated — длительно допустимый ток при +25 °C воздуха.
  АС-240:
    r_ohm_km: 0.118
    x_ohm_km: 0.405
    b_s_km: 2.81e-6
    i_rated_a: 610
    diameter_m: 0.0216
    status: допущение
    basis: типовые значения для провода АС-240/32 на линии 110 кВ; требуют сверки со справочником (ГОСТ 839)
  АС-185:
    r_ohm_km: 0.159
    x_ohm_km: 0.413
    b_s_km: 2.75e-6
    i_rated_a: 510
    diameter_m: 0.0188
    status: допущение
    basis: типовые значения для провода АС-185/29; требуют сверки со справочником
  АС-120:
    r_ohm_km: 0.244
    x_ohm_km: 0.427
    b_s_km: 2.66e-6
    i_rated_a: 390
    diameter_m: 0.0152
    status: допущение
    basis: типовые значения для провода АС-120/19; требуют сверки со справочником

buses:
  # share — доля узла в суммарной нагрузке системы
  - {id: 1, name: МАЭК (Актау),     short: МАЭК,       share: 0.0,       status: допущение, basis: точка подключения МАЭК, условно без нагрузки}
  - {id: 2, name: ПС Актау-Город,   short: Актау,      share: 0.34375,   status: допущение, basis: 55 из 160 МВт}
  - {id: 3, name: ПС Промзона,      short: Промзона,   share: 0.1875,    status: допущение, basis: 30 из 160 МВт}
  - {id: 4, name: ПС Форт-Шевченко, short: Форт-Шевч., share: 0.075,     status: допущение, basis: 12 из 160 МВт}
  - {id: 5, name: ПС Жетыбай,       short: Жетыбай,    share: 0.1125,    status: допущение, basis: 18 из 160 МВт}
  - {id: 6, name: ПС Жанаозен,      short: Жанаозен,   share: 0.1875,    status: допущение, basis: 30 из 160 МВт}
  - {id: 7, name: ПС Шетпе,         short: Шетпе,      share: 0.0375,    status: допущение, basis: 6 из 160 МВт}
  - {id: 8, name: ПС Бейнеу,        short: Бейнеу,     share: 0.05625,   status: допущение, basis: 9 из 160 МВт}

lines:
  - {id: L1,  from: 1, to: 2, km: 15,  conductor: АС-240, name: МАЭК — Актау,           status: допущение, basis: условная топология}
  - {id: L2,  from: 1, to: 3, km: 22,  conductor: АС-240, name: МАЭК — Промзона,        status: допущение, basis: условная топология}
  - {id: L3,  from: 2, to: 3, km: 14,  conductor: АС-185, name: Актау — Промзона,       status: допущение, basis: условная топология}
  - {id: L4,  from: 1, to: 7, km: 95,  conductor: АС-185, name: МАЭК — Шетпе,           status: допущение, basis: условная топология}
  - {id: L5,  from: 7, to: 4, km: 75,  conductor: АС-120, name: Шетпе — Форт-Шевченко,  status: допущение, basis: условная топология}
  - {id: L6,  from: 3, to: 5, km: 70,  conductor: АС-185, name: Промзона — Жетыбай,     status: допущение, basis: условная топология}
  - {id: L7,  from: 5, to: 6, km: 60,  conductor: АС-185, name: Жетыбай — Жанаозен,     status: допущение, basis: условная топология}
  - {id: L8,  from: 2, to: 5, km: 85,  conductor: АС-185, name: Актау — Жетыбай,        status: допущение, basis: условная топология}
  - {id: L9,  from: 6, to: 8, km: 150, conductor: АС-120, name: Жанаозен — Бейнеу,      status: допущение, basis: условная топология}
  - {id: L10, from: 7, to: 8, km: 175, conductor: АС-120, name: Шетпе — Бейнеу,         status: допущение, basis: условная топология}
  - {id: L11, from: 2, to: 4, km: 110, conductor: АС-120, name: Актау — Форт-Шевченко,  status: допущение, basis: условная топология}

generators:
  # p_mw — базовая загрузка; у балансирующего (slack) задаётся только напряжение.
  # ramp_mw_h — допустимая скорость набора/сброса мощности за час.
  - {id: G1, bus: 1, name: МАЭК (ТЭЦ/ТЭС), slack: true,  p_mw: null, p_max_mw: 330, q_min_mvar: -150, q_max_mvar: 220, v_pu: 1.04, ramp_mw_h: 60, status: допущение, basis: располагаемая мощность для сети 110 кВ в модели}
  - {id: G2, bus: 6, name: ГТЭС Жанаозен,  slack: false, p_mw: 35,   p_max_mw: 50,  q_min_mvar: -20,  q_max_mvar: 30,  v_pu: 1.02, ramp_mw_h: 20, status: допущение, basis: условная местная газотурбинная генерация}
  - {id: G3, bus: 5, name: ГТУ Жетыбай,    slack: false, p_mw: 15,   p_max_mw: 28,  q_min_mvar: -10,  q_max_mvar: 18,  v_pu: 1.02, ramp_mw_h: 12, status: допущение, basis: условная местная газотурбинная генерация}

model:
  alpha_al_per_c:
    value: 0.00403
    status: допущение
    basis: температурный коэффициент сопротивления алюминия (стандартное физическое значение; в модели применяется ко всему проводу АС)
  conductor_overheat_c:
    value: 15
    status: допущение
    basis: провод под нагрузкой условно на 15 °C теплее воздуха (для поправки сопротивления)
  reactive_load:
    tan_phi_base: 0.42
    tan_phi_per_c_above_25: 0.005
    status: допущение
    basis: cos φ ≈ 0.92 при умеренной температуре; в жару растёт реактивная нагрузка кондиционеров
  static_rating:
    conductor_t_max_c: 70
    reference_air_c: 25
    max_factor: 1.25
    status: допущение
    basis: допустимый ток ∝ sqrt((70 − T)/(70 − 25)), ограничен сверху 1.25
  voltage_limits_pu:
    crit_low: 0.90
    warn_low: 0.95
    warn_high: 1.05
    crit_high: 1.10
    status: допущение
    basis: пороги для прототипа; реальные допустимые уровни определяются нормативами для конкретной сети
  achr_reserve:
    value: 0.95
    status: допущение
    basis: при дефиците в острове АЧР оставляет нагрузку не более 95 % располагаемой мощности генерации
